# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
# 与 192.168.15.4 上的 deepseek harness 保持一致的专家/团队启用清单。
- id: agency-agents
  name: "@michengai/dsh-agency-agents"
  config:
    enabled:
      - academic-historian
      - academic-psychologist
      - chief-executive-officer
      - chief-technology-officer
      - engineering-database-optimizer
      - engineering-developer-tooling-engineer
      - engineering-software-architect
      - security-appsec-engineer
      - testing-reality-checker
      - engineering-data-engineer
      - support-analytics-reporter
      - engineering-data-visualization-engineer
      - research-synthesist
      - product-trend-researcher
      - specialized-strategy-duel-agent
      - marketing-developer-community-builder
    customExperts: []
    enabledTeams:
      - team-technical
      - team-data
      - team-research
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: true
    allowedModels:
      - provider: deepseek-official
        model: deepseek-flash
      - provider: deepseek-official
        model: deepseek-v4-pro
- id: plugin-notify
  name: "@goodandready/dsh-plugin-notify"
  config:
    events: []
    local: true
    enableSound: false
    enableToasts: false
    enableDesktopNotifications: true
    notifyBackgroundOnly: true
    timeoutMs: 5000
    includeSession: true
    includeDuration: true
    excludeSessionPrefixes: []
- id: web-search-free
  name: dsh-free-search
  config:
    provider: multi
    disabledEngines: []
    bingMarket: zh-CN
- id: vision-router
  name: dsh-vision-router
  config:
    progressiveTools: false
    onboardingSeen: true
    providers:
      - provider: deepseek-official
        model: deepseek-flash
        fallbacks: []
      - provider: vision-http
        model: ovh/Qwen3.5-397B-A17B
        fallbacks: []
    structuredVisionBootstrap: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high

- insert:
    - id: skill-office
      name: "@deepseek-ai/dsh-skill-office"
      config:
        assetRoot: /Users/luoguang/.bun/install/global/node_modules/@deepseek-ai/dsh-skill-office/assets
        node: /opt/homebrew/bin/node
        cli: /Users/luoguang/.bun/install/global/node_modules/@deepseek-ai/libreoffice-kit/lib/cli.js
