"$schema" = 'https://starship.rs/config-schema.json'

palette = "mocha"
format = """
[](lavender)$directory[](lavender) $git_branch$git_status$nodejs$bun$rust$golang$php$python$line_break$character"""
right_format = "$cmd_duration$time"

[palettes.mocha]
base = "#1e1e2e"
muted = "#a6adc8"
lavender = "#b4befe"
blue = "#89b4fa"
yellow = "#f9e2af"
green = "#a6e3a1"
red = "#f38ba8"
teal = "#94e2d5"

[directory]
style = "bold fg:base bg:lavender"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "lavender"
format = "[$symbol$branch ]($style)"

[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\] ]($style))'

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version ]($style)"

[bun]
symbol = " "
style = "yellow"
format = "[$symbol$version ]($style)"

[rust]
symbol = " "
style = "yellow"
format = "[$symbol$version ]($style)"

[golang]
symbol = " "
style = "teal"
format = "[$symbol$version ]($style)"

[php]
symbol = " "
style = "lavender"
format = "[$symbol$version ]($style)"

[python]
symbol = " "
style = "blue"
format = '[$symbol$pyenv_prefix$version( \($virtualenv\)) ]($style)'

[cmd_duration]
min_time = 1500
style = "yellow"
format = "[󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold lavender)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
